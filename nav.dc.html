<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/modernist-78f59208-95a7-4955-8dcc-4c6ca0db9005/styles.css"><link rel="stylesheet" href="responsive.css"></helmet>
<header class="hd-header">
  <div class="hd-service-ribbon"><span>THIS SUNDAY</span><a href="houston.dc.html">Houston · 8:30 + 11:30 AM</a><i></i><a href="katy.dc.html">Katy · 10:00 AM + 12:45 PM</a></div>
  <div class="hd-nav-shell">
    <a class="hd-brand" href="home.dc.html"><img src="assets/hd-logo.svg" alt="Higher Dimension Church"></a>
    <nav class="hd-desktop-nav" data-desk aria-label="Main navigation">
      <a href="about.dc.html" ref="{{ l0 }}">About</a>
      <a href="visit.dc.html" ref="{{ l1 }}">Plan a Visit</a>
      <a href="groups.dc.html" ref="{{ l2 }}">Groups</a>
      <a href="ministries.dc.html" ref="{{ l3 }}">Ministries</a>
      <a href="events.dc.html" ref="{{ l4 }}">Events</a>
      <a href="media.dc.html">Messages</a>
    </nav>
    <div class="hd-nav-actions" data-desk-actions><a class="hd-give-link" href="giving.dc.html">Give</a><a class="hd-nav-visit" href="visit.dc.html">I’m New <span>↗</span></a></div>
    <button class="hd-menu-button" data-mob onClick="{{ toggle }}" aria-label="Open menu" aria-expanded="{{ open }}" aria-controls="mobile-menu"><span></span><span></span></button>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div class="hd-mobile-menu" id="mobile-menu"><nav aria-label="Mobile navigation"><a href="about.dc.html">About</a><a href="visit.dc.html">Plan a Visit</a><a href="groups.dc.html">Groups</a><a href="ministries.dc.html">Ministries</a><a href="events.dc.html">Events</a><a href="media.dc.html">Messages</a><a href="giving.dc.html">Give</a></nav><a class="hd-button hd-button-primary" href="visit.dc.html">I’m New <span>↗</span></a></div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;,&quot;default&quot;:&quot;home&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  componentDidMount() {
    const map = { about:0, visit:1, groups:2, ministries:3, events:4 };
    const i = map[this.props.active];
    if (i !== undefined && this['_l'+i]) this['_l'+i].setAttribute('aria-current','page');
    const mq = window.matchMedia('(max-width: 980px)');
    const apply = () => {
      const root = this.el || document;
      root.querySelectorAll('[data-desk], [data-desk-actions]').forEach(el => el.style.display = mq.matches ? 'none' : 'flex');
      const mob = root.querySelector('[data-mob]'); if (mob) mob.style.display = mq.matches ? 'flex' : 'none';
      if (!mq.matches && this.state.open) this.setState({open:false});
    };
    this._mq=mq; this._apply=apply; mq.addEventListener('change',apply); apply();
  }
  componentWillUnmount(){ if(this._mq&&this._apply)this._mq.removeEventListener('change',this._apply); }
  renderVals(){return{open:this.state.open,toggle:()=>this.setState(s=>({open:!s.open})),l0:e=>this._l0=e,l1:e=>this._l1=e,l2:e=>this._l2=e,l3:e=>this._l3=e,l4:e=>this._l4=e};}
}
</script>
</body>
</html>
