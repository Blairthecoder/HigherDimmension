</x-dc><script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:96}}">class Component extends DCLogic { state={open:false}; componentDidMount(){const mq=window.matchMedia('(max-width: 980px)');const apply=()=>{const root=this.el||document;root.querySelectorAll('[data-desk], [data-desk-actions]').forEach(el=>el.style.display=mq.matches?'none':'flex');const mob=root.querySelector('[data-mob]');if(mob)mob.style.display=mq.matches?'flex':'none';if(!mq.matches&&this.state.open)this.setState({open:false});};this._mq=mq;this._apply=apply;mq.addEventListener('change',apply);apply();} componentWillUnmount(){if(this._mq&&this._apply)this._mq.removeEventListener('change',this._apply);} renderVals(){return{open:this.state.open,toggle:()=>this.setState(s=>({open:!s.open}))};}}</script></body></html>
